<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKI MAGIC AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --secondary-accent: #06b6d4;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--secondary-accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea, input[type="text"], input[type="file"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button, .file-label {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
            text-align: center;
        }

        button:hover:not(:disabled), .file-label:hover {
            background-color: var(--accent-hover);
        }

        button:active:not(:disabled), .file-label:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.btn-danger {
            background-color: var(--danger-color);
        }

        button.btn-danger:hover:not(:disabled) {
            background-color: var(--danger-hover);
        }

        button.btn-secondary {
            background-color: var(--secondary-accent);
            color: #0f172a;
        }

        button.btn-secondary:hover:not(:disabled) {
            background-color: #0891b2;
            color: #fff;
        }

        input[type="file"] {
            display: none;
        }

        .media-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-color);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border-color);
            padding: 12px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            word-break: break-word;
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>AKI MAGIC AI</h1>
        <p>AI Video Generation & Tamil Voice Synthesis Studio</p>
    </header>

    <div class="container">
        <!-- Feature 1: AI Video Generator -->
        <div class="card">
            <h2>AI Video Generator</h2>
            <div class="input-group">
                <label for="aiPrompt">Prompt</label>
                <textarea id="aiPrompt" placeholder="Describe the video you want to generate..."></textarea>
            </div>
            <button id="generateBtn" onclick="generateAiVideo()">Generate AI Video</button>
            <div class="media-container" id="aiVideoContainer">
                <span class="placeholder-text">Generated video will appear here</span>
            </div>
        </div>

        <!-- Feature 2 & 3: Video Upload & Tamil Voice Controls -->
        <div class="card">
            <h2>Free Video Player & Tamil Voice</h2>
            
            <div class="input-group">
                <label>Upload Video</label>
                <label for="videoUpload" class="file-label">Choose Video File</label>
                <input type="file" id="videoUpload" accept="video/*" onchange="loadVideo(event)">
            </div>

            <div class="media-container">
                <video id="freePreview" controls style="display: none;"></video>
                <span id="previewPlaceholder" class="placeholder-text">Upload a video to preview</span>
            </div>

            <div class="input-group">
                <label for="tamilText">Tamil Voice Text</label>
                <textarea id="tamilText" placeholder="இங்கே தமிழில் உள்ளடைக்கவும்...">வணக்கம்! ஏகேஐ மேஜிக் ஏஐ பக்கத்திற்கு உங்களை வரவேற்கிறோம்.</textarea>
            </div>

            <div class="btn-group">
                <button onclick="speakTamil()">Speak Tamil</button>
                <button class="btn-danger" onclick="stopVoice()">Stop Voice</button>
            </div>

            <!-- Play Video + Tamil Voice Button -->
            <div class="btn-group">
                <button class="btn-secondary" onclick="playVideoWithTamilVoice()">Play Video + Tamil Voice</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 AKI MAGIC AI. All rights reserved.
    </footer>

    <script>
        const BACKEND_URL = 'https://akilesh-video-ai-1.onrender.com';

        // Feature 1: Real AI Video Generation API Logic
        async function generateAiVideo() {
            const promptInput = document.getElementById('aiPrompt');
            const generateBtn = document.getElementById('generateBtn');
            const container = document.getElementById('aiVideoContainer');
            const prompt = promptInput.value.trim();

            if (!prompt) {
                alert('Please enter a prompt to generate video.');
                return;
            }

            generateBtn.disabled = true;
            container.innerHTML = `<span class="placeholder-text">Connecting to AKI MAGIC AI backend and generating video for: "${escapeHtml(prompt)}"...</span>`;

            try {
                const response = await fetch(`${BACKEND_URL}/generate-video`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    let errorDetail = `Server responded with status ${response.status}`;
                    try {
                        const errData = await response.json();
                        errorDetail = errData.detail || errData.error || errData.message || errorDetail;
                    } catch (_) {
                        const errText = await response.text();
                        if (errText) errorDetail = errText;
                    }
                    throw new Error(errorDetail);
                }

                const contentType = response.headers.get('content-type') || '';
                let videoUrl = '';

                if (contentType.includes('video/')) {
                    const blob = await response.blob();
                    videoUrl = URL.createObjectURL(blob);
                } else {
                    const data = await response.json();
                    videoUrl = data.video_url || data.videoUrl || data.url || data.output_url || data.download_url || '';

                    if (!videoUrl && data.video_base64) {
                        videoUrl = `data:video/mp4;base64,${data.video_base64}`;
                    } else if (videoUrl && !videoUrl.startsWith('http') && !videoUrl.startsWith('data:') && !videoUrl.startsWith('blob:')) {
                        videoUrl = `${BACKEND_URL}${videoUrl.startsWith('/') ? '' : '/'}${videoUrl}`;
                    }
                }

                if (!videoUrl) {
                    throw new Error('Backend response did not include a playable video URL or stream.');
                }

                container.innerHTML = `
                    <video controls autoplay loop playsinline>
                        <source src="${escapeHtml(videoUrl)}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } catch (error) {
                console.error('AI Video Generation Error:', error);
                container.innerHTML = `<span class="placeholder-text">Generation failed: ${escapeHtml(error.message || 'Unable to reach backend API.')}</span>`;
            } finally {
                generateBtn.disabled = false;
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Feature 2: Free Video Upload and Preview Logic
        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoElement = document.getElementById('freePreview');
                const placeholder = document.getElementById('previewPlaceholder');

                if (videoElement.src && videoElement.src.startsWith('blob:')) {
                    URL.revokeObjectURL(videoElement.src);
                }

                stopVoice();
                videoElement.src = URL.createObjectURL(file);
                videoElement.style.display = 'block';
                placeholder.style.display = 'none';
            }
        }

        // Feature 3: Tamil Voice Speech Synthesis
        function speakTamil() {
            const tamilField = document.getElementById('tamilText');
            const text = tamilField ? tamilField.value.trim() : '';

            if (!text) {
                alert('தயவுசெய்து உரையை உள்ளிடவும் (Please enter text)');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('Your browser does not support Tamil speech synthesis.');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ta-IN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const tamilVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ta'));
            if (tamilVoice) {
                utterance.voice = tamilVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Stop Tamil Voice
        function stopVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // Play Video + Tamil Voice & Sync Events on #freePreview
        const freeVideo = document.getElementById('freePreview');
        let syncedByButton = false;

        function hasUploadedVideo() {
            const uploadInput = document.getElementById('videoUpload');
            const hasFile = uploadInput && uploadInput.files && uploadInput.files.length > 0;
            const hasSrc = Boolean(freeVideo.getAttribute('src')) || freeVideo.querySelectorAll('source').length > 0;
            return hasFile && hasSrc;
        }

        function playVideoWithTamilVoice() {
            if (!hasUploadedVideo()) {
                alert('தயவுசெய்து முதலில் ஒரு வீடியோவை பதிவேற்றவும் (Please upload a video first)');
                return;
            }

            syncedByButton = true;
            stopVoice();

            freeVideo.play()
                .then(() => {
                    speakTamil();
                })
                .catch(err => {
                    syncedByButton = false;
                    console.error('Video playback failed:', err);
                });
        }

        // When video is paused, stop Tamil speech
        freeVideo.addEventListener('pause', () => {
            stopVoice();
        });

        // When video resumes after being paused, restart Tamil speech from the beginning
        freeVideo.addEventListener('play', () => {
            if (syncedByButton) {
                syncedByButton = false;
                return;
            }
            if (hasUploadedVideo()) {
                speakTamil();
            }
        });

        // When video ends, stop Tamil speech
        freeVideo.addEventListener('ended', () => {
            syncedByButton = false;
            stopVoice();
        });
    
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKI MAGIC AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0f172a;color:white;font-family:Arial,sans-serif}
header{text-align:center;margin-bottom:25px}
h1{color:#06b6d4}
.container{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:700px){.container{grid-template-columns:1fr 1fr}}
.card{background:#1e293b;padding:20px;border-radius:15px;border:1px solid #334155}
h2{color:#06b6d4}
textarea{width:100%;min-height:100px;padding:12px;border-radius:8px;background:#0f172a;color:white;border:1px solid #475569}
button,.file-label{display:inline-block;padding:12px;margin:5px 0;background:#6366f1;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer;text-align:center}
button:disabled{opacity:.5}
.danger{background:#dc2626}
.secondary{background:#0891b2}
input[type=file]{width:100%;margin:10px 0}
video{width:100%;margin-top:12px;background:#000;border-radius:8px}
.status{color:#fbbf24;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>AKI MAGIC AI</h1>
<p>AI Video Generation & Tamil Voice Studio</p>
</header>

<div class="container">
<section class="card">
<h2>🎬 AI Video Generator</h2>
<textarea id="aiPrompt" placeholder="Describe your video..."></textarea>
<button id="generateBtn" onclick="generateAiVideo()">Generate AI Video</button>
<p id="status" class="status"></p>
<video id="aiResult" controls playsinline style="display:none"></video>
</section>

<section class="card">
<h2>🎥 Free Video Upload</h2>
<input type="file" id="videoUpload" accept="video/*">
<video id="freePreview" controls playsinline style="display:none"></video>

<h2>🗣️ Tamil Voice</h2>
<textarea id="tamilText" placeholder="தமிழில் எழுதுங்கள்...">வணக்கம்! AKI MAGIC AI பக்கத்திற்கு உங்களை வரவேற்கிறோம்.</textarea>
<button onclick="speakTamil()">Speak Tamil</button>
<button class="danger" onclick="stopVoice()">Stop Voice</button>
<button class="secondary" onclick="playVideoWithTamilVoice()">Play Video + Tamil Voice</button>
</section>
</div>

<script>
const BACKEND_URL = "https://akilesh-video-ai-1.onrender.com";

let videoURL = null;
let speechText = "";
let speakingWithVideo = false;

function speakTamil() {
  const text = document.getElementById("tamilText").value.trim();
  if (!text) {
    alert("தமிழில் எழுதுங்கள்");
    return;
  }
  if (!("speechSynthesis" in window)) {
    alert("இந்த browser-ல் voice support இல்லை");
    return;
  }
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ta-IN";
  msg.rate = 1;
  speechSynthesis.speak(msg);
}

function stopVoice() {
  speechSynthesis.cancel();
  speakingWithVideo = false;
}

document.getElementById("videoUpload").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  const video = document.getElementById("freePreview");
  if (videoURL) URL.revokeObjectURL(videoURL);
  stopVoice();
  videoURL = URL.createObjectURL(file);
  video.src = videoURL;
  video.style.display = "block";
});

function playVideoWithTamilVoice() {
  const video = document.getElementById("freePreview");
  const text = document.getElementById("tamilText").value.trim();

  if (!videoURL) {
    alert("முதலில் Video Upload செய்யுங்கள்");
    return;
  }
  if (!text) {
    alert("தமிழ் வசனம் எழுதுங்கள்");
    return;
  }

  speechSynthesis.cancel();
  speechText = text;
  speakingWithVideo = true;

  const msg = new SpeechSynthesisUtterance(speechText);
  msg.lang = "ta-IN";
  msg.rate = 1;
  msg.onend = () => { speakingWithVideo = false; };

  video.play().then(() => {
    speechSynthesis.speak(msg);
  }).catch(() => {
    alert("Video play செய்ய முடியவில்லை");
  });
}

const freeVideo = document.getElementById("freePreview");

freeVideo.addEventListener("pause", () => {
  if (speakingWithVideo) {
    speechSynthesis.cancel();
  }
});

freeVideo.addEventListener("ended", () => {
  stopVoice();
});

freeVideo.addEventListener("play", () => {
  if (speakingWithVideo && speechSynthesis.paused) {
    speechSynthesis.resume();
  }
});

async function generateAiVideo() {
  const prompt = document.getElementById("aiPrompt").value.trim();
  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("aiResult");

  if (!prompt) {
    alert("Video prompt எழுதுங்கள்");
    return;
  }

  button.disabled = true;
  status.textContent = "Connecting to AI backend...";

  try {
    const response = await fetch(BACKEND_URL + "/generate-video", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt})
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error || "Generation failed");
    }

    const type = response.headers.get("content-type") || "";
    let url;

    if (type.includes("video/")) {
      url = URL.createObjectURL(await response.blob());
    } else {
      const data = await response.json();
      url = data.video_url || data.videoUrl || data.url || data.output_url;
      if (url && url.startsWith("/")) url = BACKEND_URL + url;
    }

    if (!url) throw new Error("Backend did not return a video URL");

    result.src = url;
    result.style.display = "block";
    status.textContent = "Video received successfully!";
  } catch (error) {
    status.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
</script>
</body>
</html>
