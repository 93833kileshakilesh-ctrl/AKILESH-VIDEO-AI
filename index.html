
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKILESH VIDEO AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090914;
  color: white;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #17132d;
  border-bottom: 2px solid #7658ff;
}

header h1 {
  color: #a995ff;
  margin: 5px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #19192b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

h2 { color: #b9a8ff; }

textarea {
  width: 100%;
  height: 110px;
  padding: 14px;
  border-radius: 10px;
  background: #292940;
  color: white;
  border: 1px solid #6254a8;
  font-size: 16px;
}

input[type=file] {
  width: 100%;
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #7658ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active { opacity: 0.8; }

video, #imagePreview {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

#imagePreview { display: none; }

#status {
  color: #b9a8ff;
  text-align: center;
}

.download {
  display: block;
  text-align: center;
  color: #a995ff;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
<h1>AKILESH VIDEO AI</h1>
<p>CREATE YOUR DREAM VIDEOS</p>
</header>

<div class="container">

<div class="card">
<h2>🎬 Text to Video</h2>

<textarea id="prompt"
placeholder="Describe your dream video..."></textarea>

<button onclick="generateText()">
Generate Video
</button>
</div>

<div class="card">
<h2>🖼️ Image to Video</h2>

<input type="file" id="imageInput"
accept="image/*" onchange="previewImage()">

<img id="imagePreview">

<textarea id="imagePrompt"
placeholder="Describe how your image should move..."></textarea>

<button onclick="generateImage()">
Create Video
</button>
</div>

<div class="card">
<h2>🎥 Video Preview</h2>

<video id="videoPreview" controls
style="display:none"></video>

<p id="status">Your AI video will appear here.</p>

<a id="downloadLink" class="download"
style="display:none" download="akilesh-video.webm">
Download Video
</a>
</div>

</div>

<script>
function generateText() {
  const prompt = document.getElementById("prompt").value;

  if (!prompt.trim()) {
    alert("Please enter your video idea!");
    return;
  }

  document.getElementById("status").innerText =
    "Your prompt is ready. Connect an AI video API to generate a real video.";
}

function previewImage() {
  const file = document.getElementById("imageInput").files[0];

  if (!file) return;

  const image = document.getElementById("imagePreview");
  image.src = URL.createObjectURL(file);
  image.style.display = "block";
}

function generateImage() {
  const file = document.getElementById("imageInput").files[0];

  if (!file) {
    alert("Please upload an image!");
    return;
  }

  document.getElementById("status").innerText =
    "Image uploaded successfully! Connect an AI video API to animate it.";
}
</script>

</body>
</html>
