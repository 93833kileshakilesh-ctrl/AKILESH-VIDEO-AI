
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKI MAGIC AI</title>
<style>
body {
  background:#101020;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:25px;
}
h1 {color:#00e5ff}
textarea {
  width:95%;
  height:120px;
  border-radius:12px;
  padding:10px;
}
button {
  background:#00e5ff;
  padding:15px 25px;
  border:0;
  border-radius:12px;
  font-weight:bold;
}
#result {margin-top:25px}
</style>
</head>
<body>
<h1>AKI MAGIC AI</h1>
<h3>AI VIDEO STUDIO</h3>
<textarea id="prompt" placeholder="Enter your video idea"></textarea>
<br><br>
<button onclick="generate()">GENERATE</button>
<div id="result"></div>
<script>
function generate() {
 let p=document.getElementById("prompt").value.trim();
 let r=document.getElementById("result");
 if(!p) {
  r.innerText="Please enter your idea!";
  return;
 }
 r.innerText="Your video prompt is ready: "+p+
 ". AI video generation service needs to be connected.";
}
</script>
</body>
</html>
